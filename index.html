<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Deutschlandtabelle ist umgezogen</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://deutschlandtabelle.github.io/">
<!-- Erst der Sprung per Skript: nur so bleibt der Anker erhalten, damit
     ein geteilter Link wie .../#fussball?top=bester dort ankommt, wo er
     hinzeigt. Das meta-refresh darunter fängt Browser ohne Skript ab. -->
<script>
  location.replace('https://deutschlandtabelle.github.io/'
    + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="1; url=https://deutschlandtabelle.github.io/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:#f5f5f7;color:#1d1d1f;text-align:center;padding:24px;
    font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,
         Arial,sans-serif;letter-spacing:-.01em}
  h1{font-size:clamp(28px,5vw,44px);font-weight:600;letter-spacing:-.025em;
    margin:0 0 12px}
  p{margin:0 0 22px;color:#6e6e73}
  a.knopf{display:inline-block;background:#1a6b3c;color:#fff;border-radius:980px;
    padding:13px 24px;text-decoration:none}
  @media (prefers-color-scheme:dark){
    body{background:#000;color:#f5f5f7} p{color:#a1a1a6}
    a.knopf{background:#4ec27f;color:#00210f}
  }
</style>
</head>
<body>
  <main>
    <h1>Umgezogen</h1>
    <p>Aus ClubRank wurde die Deutschlandtabelle.<br>
       Diese Seite leitet gleich weiter.</p>
    <a class="knopf" href="https://deutschlandtabelle.github.io/">Zur
      Deutschlandtabelle</a>
  </main>
</body>
</html>
